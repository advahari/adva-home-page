<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Gallery</p>
        <h1>Image Carousel</h1>
      </header>

      <section class="carousel" aria-label="Image gallery carousel">
        <div class="carousel-frame">
          <div class="slides" id="slides" aria-live="polite"></div>
        </div>

        <div class="gallery-controls">
          <button class="nav-button prev" type="button" aria-label="Previous image">&#10094;</button>
          <button class="nav-button next" type="button" aria-label="Next image">&#10095;</button>
        </div>
      </section>

      <div class="dots" id="dots" aria-label="Carousel indicators"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
